<!-- Only display the summary table if there is at least one item in the summaryData array -->
<div class="summary-table-container" *ngIf="summaryData.length">
  <!-- Material table displaying summary fields and their values -->
  <table
    mat-table
    [dataSource]="summaryData"
    class="mat-elevation-z8 full-width"
  >
    <!-- Column definition for the 'label' (field name) -->
    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef>Field</th>
      <td mat-cell *matCellDef="let element">{{ element.label }}</td>
    </ng-container>

    <!-- Column definition for the 'value' (field value) -->
    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef>Value</th>
      <td mat-cell *matCellDef="let element">{{ element.value }}</td>
    </ng-container>

    <!-- Header row definition using the defined columns -->
    <tr mat-header-row *matHeaderRowDef="['label', 'value']"></tr>

    <!-- Row definition for each data entry -->
    <tr mat-row *matRowDef="let row; columns: ['label', 'value']"></tr>
  </table>
</div>
